name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Smoke test the CLI
        run: |
          ossie-guard tests/fixtures/clean.yaml
          ossie-guard tests/fixtures/drift.yaml && exit 1 || echo "correctly flagged drift"
          ossie-guard --version

  # The SARIF we emit has to satisfy the real spec, not just our own asserts.
  # The pytest suite validates it against the vendored OASIS schema; this job
  # additionally checks it with an independent validator (check-jsonschema).
  sarif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e . check-jsonschema
      - name: Generate SARIF for the fixtures
        run: |
          ossie-guard tests/fixtures/clean.yaml tests/fixtures/drift.yaml \
            tests/fixtures/unsafe.yaml \
            --format sarif --output ossie-guard.sarif --fail-level none
      - name: Validate against the vendored SARIF 2.1.0 schema
        run: |
          check-jsonschema --no-cache \
            --schemafile tests/schema/sarif-2.1.0.json ossie-guard.sarif
      - name: Show the report
        run: python -m json.tool ossie-guard.sarif | head -40

  # Dogfood the composite action exactly as a consumer would. The upload is off
  # here on purpose: the fixtures contain deliberate findings, and publishing
  # them would fill this repo's Security tab with test data.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run the action on the fixtures (gate off)
        id: guard
        uses: ./
        with:
          path: tests/fixtures
          fail-level: none
          upload-sarif: "false"
      - name: The action must have produced a SARIF report
        run: |
          file="${{ steps.guard.outputs.sarif-file }}"
          test -n "$file" || { echo "no sarif-file output"; exit 1; }
          test -s "$file" || { echo "sarif is empty"; exit 1; }
          python -c "import json,sys; d=json.load(open(sys.argv[1])); \
            assert d['version']=='2.1.0'; \
            print('results:', len(d['runs'][0]['results']))" "$file"

      - name: The action must FAIL on a drifting model when the gate is on
        id: gate
        continue-on-error: true
        uses: ./
        with:
          path: tests/fixtures/drift.yaml
          fail-level: error
          upload-sarif: "false"
      - name: Assert the gate fired
        run: |
          test "${{ steps.gate.outcome }}" = "failure" \
            || { echo "expected failure, got '${{ steps.gate.outcome }}'"; exit 1; }
          echo "fail-level gate works"

      - name: The action must PASS on a clean model
        uses: ./
        with:
          path: tests/fixtures/clean.yaml
          fail-level: error
          upload-sarif: "false"
